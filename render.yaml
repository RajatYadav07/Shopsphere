# Render Blueprint for ShopSphere Full-Stack Application
services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: shopsphere-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_NAME
        value: shopsphere_olist
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGODB_URI
        sync: false

  # 2. React Vite Frontend Static Site
  - type: web
    name: shopsphere-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
